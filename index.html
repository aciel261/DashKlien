<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Dashboard Klien Prioritas</title>
<style>
:root{
 --navy:#0B2B3B;--cyan:#00A7C4;--cyan-d:#007C93;--tint:#E8F6F9;--tint2:#F3F7F8;--line:#D9E3E7;
 --ink:#14232B;--muted:#5B6B73;--bg:#F6F8F9;--card:#FFFFFF;
 --crit:#C8382F;--crit-bg:#FBE9E7;--warn:#9A6400;--warn-bg:#FFF3D6;--good:#1E7B4A;--good-bg:#E3F4EA;--gray:#8A979D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
header .sub{font-size:12px;color:#A9C3CC}
.hbtn{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--cyan)}
button.pri{background:var(--cyan);border-color:var(--cyan);color:#fff;font-weight:600}
button.pri:hover{background:var(--cyan-d)}
header button{background:transparent;color:#fff;border-color:#3D5966}
header button:hover{border-color:#fff}
nav{display:flex;gap:4px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;padding:12px 14px;background:none;font-weight:600;color:var(--muted);white-space:nowrap}
nav button.on{color:var(--navy);border-bottom-color:var(--cyan)}
main{padding:18px 20px 60px;max-width:1280px;margin:0 auto}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid #F0D68A;padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:900px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4,.g3{grid-template-columns:1fr}main{padding:14px 12px 60px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--navy)}
.card .hint{font-size:12px;color:var(--muted)}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:700;color:var(--navy);line-height:1.1;margin:4px 0}
.tile .v small{font-size:15px;color:var(--muted);font-weight:500}
.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan-d);font-weight:700;margin:22px 0 8px}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--tint2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.L{background:#EFE9FA;border-color:#D8CDF0}.chip.A26{background:var(--tint);border-color:#BFE5EE}.chip.D25{background:#FFF3D6;border-color:#F0D68A}.chip.D24{background:#F1EDE6;border-color:#DCD3C4}
.st{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;font-weight:600;white-space:nowrap}
.due{font-size:12px;font-weight:700;white-space:nowrap}
.due.over{color:var(--crit)}.due.today{color:var(--warn)}.due.soon{color:var(--muted)}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.badge.crit{background:var(--crit-bg);color:var(--crit)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.good{background:var(--good-bg);color:var(--good)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--tint2);position:sticky;top:0}
tr.row:hover{background:var(--tint2);cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:70vh}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
select,input[type=text],input[type=date],input[type=number],textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:54px}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:8px}
.act .t{font-weight:600}.act .s{font-size:12.5px;color:var(--muted)}
.act .b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--navy);color:#fff;padding:1px 6px;border-radius:4px}
.bar{height:10px;background:var(--tint2);border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--cyan);border-radius:5px 0 0 5px}
.bar b{position:absolute;top:-3px;width:2px;height:16px;background:var(--navy)}
.prow{display:grid;grid-template-columns:110px minmax(0,1fr) 170px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
/* drawer */
#ov{position:fixed;inset:0;background:rgba(11,43,59,.35);display:none;z-index:20}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:21;transform:translateX(100%);transition:transform .18s;overflow-y:auto;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
#dr.open{transform:none}#ov.open{display:block}
.dh{background:var(--navy);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:2}
.dh h2{margin:0;font-size:18px}.dh .m{font-size:12.5px;color:#A9C3CC;margin-top:3px}
.db{padding:14px 18px 40px}
.fs{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:12px}
.fs legend{font-size:12px;font-weight:700;color:var(--cyan-d);padding:0 4px;text-transform:uppercase;letter-spacing:.06em}
.fr{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0;font-size:13px}
.fr label{color:var(--muted)}
.next{background:var(--tint);border:1px solid #BFE5EE;border-radius:9px;padding:10px 12px;margin-bottom:12px}
.log{font-size:12.5px;border-left:2px solid var(--line);padding-left:10px;margin:4px 0}
.muted{color:var(--muted)}.small{font-size:12px}
.lever{border-left:4px solid var(--cyan)}
.lever .met{font-size:24px;font-weight:700;color:var(--navy)}
.lever p{margin:6px 0;font-size:13px}
.prop{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:4px}
#tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;display:none;z-index:30;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2px solid}
ul.tight{margin:6px 0;padding-left:18px}ul.tight li{margin:3px 0}
.empty{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px}

.chip.BARU{background:#E3F4EA;border-color:#B9E0C8}
.ord{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:12.5px;background:#fff}.ord b{color:var(--navy)}
.ofm{background:var(--tint2);border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:8px}.ofm .fr{grid-template-columns:120px minmax(0,1fr)}
.ofm input,.ofm select{width:100%;min-width:0;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink)}.ofm .chk{margin:0}
.badge.gold{background:#FFF3D6;color:#7A5200}
.cid{font-family:ui-monospace,Consolas,monospace;font-size:11px;background:var(--tint2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:var(--navy)}
.dh .cid{background:#173B4D;border-color:#3D5966;color:#BFE9F2}
/* laporan hasil cek */
#rp{position:fixed;inset:0;background:#dfeef2;z-index:40;display:none;overflow-y:auto}#rp.open{display:block}
.rptop{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rptop .rpbtn{display:flex;gap:6px;flex-wrap:wrap}.rptop button{background:transparent;color:#fff;border-color:#3D5966}.rptop button.pri{background:var(--cyan);border-color:var(--cyan)}
.rpwrap{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;align-items:start}
@media(max-width:980px){.rpwrap{grid-template-columns:minmax(0,1fr)}}
.rpform{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.rpsec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan-d);font-weight:700;margin:16px 0 8px}.rpsec:first-child{margin-top:0}
.rpg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}@media(max-width:560px){.rpg{grid-template-columns:minmax(0,1fr)}}
.rpg label,.rpitem>label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.rpg input,.rpg select,.rpitem textarea{width:100%;min-width:0;background:#FFF9DB;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;font-size:13px;color:var(--ink)}
.rpitem{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--tint2)}
.rph{font-weight:700;color:var(--cyan-d);margin-bottom:8px}
.ph2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}@media(max-width:560px){.ph2{grid-template-columns:minmax(0,1fr)}}
.slot{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:6px;font-size:11px;color:var(--muted)}.slot b{display:block;color:var(--navy);font-size:11.5px;margin-bottom:2px}
.slot canvas{width:100%;border-radius:5px;display:block;margin:4px 0;background:#f2f6f7}.slot input[type=file]{font-size:10.5px;width:100%}
.tapmode{display:flex;gap:10px;font-size:11.5px;margin:2px 0 4px}
.score{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}.score .big{font-size:22px;font-weight:700;color:var(--navy);min-width:30px;text-align:center}
.warnb{background:#FFF1D6;color:#8A5B00;border-radius:8px;padding:8px 10px;font-size:12.5px;margin:6px 0}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-bottom:8px}.chk label{display:flex;gap:5px;align-items:center}
.sarbox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;margin:6px 0}
.rpnote{font-size:12px;color:var(--muted);background:var(--tint);border-radius:8px;padding:10px 12px;margin-top:12px;line-height:1.45}
.rpwa{width:100%;min-height:160px;margin-bottom:6px}
#rep{background:#fff;width:420px;max-width:100%;border-radius:18px;overflow:hidden;box-shadow:0 18px 44px rgba(11,43,59,.18);margin:0 auto;font-family:Calibri,"Segoe UI",Arial,sans-serif;color:#1F2A30}
#rep .rh{background:#0B2B3B;color:#fff;padding:22px 22px 18px}#rep .rh .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7fdbea}
#rep .rh h1{font-size:23px;margin:6px 0 4px;font-weight:700;line-height:1.15}#rep .rh .m{font-size:13px;color:#cfe6ec;line-height:1.45}
#rep .rk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#007E96;font-weight:700}
#rep .rsum{margin:16px 22px 0;padding:12px 14px;border:1px solid #CFE3E8;border-radius:12px;background:#F3FBFC}
#rep .rrow{padding:8px 0;border-bottom:1px solid #DDEBEE}#rep .rrow:last-of-type{border-bottom:none}
#rep .rrt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}#rep .rrs{font-size:13px;color:#33444C;margin-top:3px}
#rep .rnext{margin-top:8px;font-size:13px;line-height:1.5;background:#E6F6F9;border-radius:8px;padding:8px 10px}
#rep .pill{font-size:12px;font-weight:700;color:#fff;padding:3px 9px;border-radius:20px;white-space:nowrap}
#rep .rcard{margin:12px 22px;border:1px solid #CFE3E8;border-radius:12px;overflow:hidden}
#rep .rch{padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;border-bottom:1px solid #CFE3E8}#rep .rch b{font-size:16px;color:#0B2B3B}#rep .rch small{display:block;font-size:12.5px;color:#5F7078}
#rep .rcb{padding:12px 14px;font-size:13.5px;line-height:1.5}
#rep .rtwo{display:grid;grid-template-columns:1fr 1fr;gap:6px}#rep .rtwo figure{margin:0}#rep .rtwo img{height:150px;width:100%;object-fit:cover;border-radius:6px;border:1px solid #CFE3E8}#rep .rtwo figcaption{font-size:10.5px;color:#5F7078;text-align:center}
#rep .rnote{margin-top:8px;font-size:13px;background:#F3FBFC;border-radius:6px;padding:7px 10px}
#rep .bar5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 4px}#rep .bar5 span{height:16px;border-radius:4px;border:1px solid #d6dfe2}#rep .bar5 span.on{border:3px solid #0B2B3B}
#rep .bl{display:flex;justify-content:space-between;font-size:10.5px;color:#5F7078;margin-bottom:8px}#rep .lvl{font-weight:700;color:#0B2B3B}
#rep .rsar{margin-top:8px;background:#F4FAFB;border-left:3px solid #00A7C4;padding:7px 10px;border-radius:0 6px 6px 0}#rep .rsar div{margin:2px 0}#rep .rk2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#007E96}
#rep .rmean{margin:12px 22px;padding:10px 12px;background:#E6F6F9;border-radius:10px;font-size:13.5px}
#rep .sig{padding:8px 22px 6px;font-size:13.5px}#rep .sig b{color:#0B2B3B}#rep .rf{padding:6px 22px 18px;font-size:11px;color:#5F7078;line-height:1.45}
#rep .brand{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;border-top:1px solid #CFE3E8;font-size:12px;color:#5F7078}#rep .brand b{color:#007E96;font-size:14px}
/* modal klien baru */
#nm{position:fixed;inset:0;background:rgba(11,43,59,.4);z-index:45;display:none;align-items:center;justify-content:center;padding:16px}#nm.open{display:flex}
#nm .box{background:#fff;border-radius:12px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto}
@media print{#rp .rptop,#rp .rpform{display:none}}
@media print{header .hbtn,nav,#dr,#ov,.noprint{display:none!important}main{padding:0}.card{break-inside:avoid}}
#syncpill{position:fixed;right:12px;bottom:12px;z-index:50;display:flex;gap:8px;align-items:center;background:#0B2B3B;color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;opacity:.93}#syncpill.bad{background:#C8382F}#syncpill button{background:none;border:0;color:#9fe3ef;cursor:pointer;font-size:12px;text-decoration:underline;padding:0}#login input{display:block;width:100%;box-sizing:border-box;padding:10px 12px;margin-bottom:10px;border:1px solid #D9E3E7;border-radius:8px;font-size:14px}
</style>
</head>
<body>
<header>
 <div><h1>HydroClean Prioritas · Dashboard Klien VIP</h1><div class="sub" id="meta">PIC: Elfi · cover: Uly · review: Owner + GM Quenta</div></div>
 <div class="hbtn">
  <button onclick="exportJSON()" title="Simpan semua data ke file (cadangan / untuk review)">Simpan file data</button>
  <button onclick="document.getElementById('imp').click()">Buka file data</button>
  <button onclick="exportCSV()">Unduh CSV (Excel)</button>
  <button id="demoBtn" onclick="toggleDemo()">Lihat contoh</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(this)">
 </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="login" style="display:none;position:fixed;inset:0;z-index:9999;background:#0B2B3B;align-items:center;justify-content:center;padding:16px"><form onsubmit="doLogin(event)" style="background:#fff;border-radius:14px;padding:28px;width:100%;max-width:340px"><div style="font-weight:700;font-size:18px;color:#0B2B3B">HydroClean Prioritas</div><div style="font-size:13px;color:#5B6B73;margin:4px 0 18px">Masuk dengan akun tim</div><input name="email" type="email" placeholder="Email" required autocomplete="username"><input name="password" type="password" placeholder="Password" required autocomplete="current-password"><div id="lerr" style="color:#C8382F;font-size:13px;min-height:20px"></div><button type="submit" style="width:100%;padding:11px;border:0;border-radius:8px;background:#00A7C4;color:#fff;font-weight:600;font-size:14px;cursor:pointer">Masuk</button></form></div>
<div id="syncpill"><span>Memuat…</span><button onclick="doLogout()">Keluar</button></div>
<script src="vendor/supabase.js"></script><script src="config.js"></script>

<div id="ov" onclick="closeDr()"></div>
<aside id="dr"></aside>
<div id="tip"></div>
<div id="rp"></div>
<div id="nm"></div>

function makeCid(wa,taken){const b='PRI-'+String(wa).replace(/\D/g,'').slice(-4).padStart(4,'0');let c=b,k=0;while(taken.has(c)){k++;c=b+String.fromCharCode(65+k)}taken.add(c);return c}
let BASE=[];let CLIENTS=BASE;function setBase(rows){const tk=new Set();BASE=rows.map(c=>({...c,cid:makeCid(c.wa,tk)}));CLIENTS=BASE}
const TARGET={L:5,A26:24,D25:28,D24:34};
const TRAJ=[['2026-10-23',5],['2026-10-30',14],['2026-11-06',24],['2026-11-13',35],['2026-11-20',47],['2026-11-27',58],['2026-12-04',68],['2026-12-11',78],['2026-12-18',86],['2026-12-31',91]];
const POOLN={L:'Loyal VIP',A26:'Aktif 2026',D25:'Dorman 2025',D24:'Dorman 2024',BARU:'Prioritas baru'};
const STAGES=[
 ['antre','Antre (belum disapa)','#EEF1F2','#5B6B73'],
 ['disapa','Disapa','#E8F0FB','#2A5C9A'],
 ['respon','Merespons','#E8F6F9','#007C93'],
 ['cek','Cek dijadwalkan','#DDF2EC','#17694E'],
 ['cekdone','Cek selesai','#D3EEDF','#1E7B4A'],
 ['order','Perawatan dijadwalkan','#CDEBDA','#17643D'],
 ['paid','Order selesai (dibayar)','#C2E6D0','#135533'],
 ['rutin','Jadwal rutin terkunci','#B7E0C6','#0F4A2C'],
 ['x_tidak','Tidak dulu','#F3EEE6','#7A6440'],
 ['x_diam','Diam (istirahat 5 bln)','#F3EEE6','#7A6440'],
 ['x_nomor','Nomor tidak aktif','#FBE9E7','#A33A2F'],
 ['x_stop','Minta tidak dihubungi','#FBE9E7','#A33A2F'],
 ['x_area','Di luar area layanan','#F3EEE6','#7A6440']];
const SI=Object.fromEntries(STAGES.map((s,i)=>[s[0],i]));
const BACK=new Set(['cek','cekdone','order','paid','rutin']);
const LOCK=new Set(['cekdone','order','paid','rutin']);
const ACTIVE=new Set(['disapa','respon','cek','cekdone','order','paid']);
const RES={B:'Baik',P:'Perlu perhatian',D:'Disarankan dirawat',G:'Disarankan diganti'};
const KEY='hcPrioritasDash.v1';
let S={clients:{},saved:null,source:'browser'};let DEMO=null;let TAB='today';let CUR=null;
const st=id=>{const B=DEMO||S;if(!B.clients[id])B.clients[id]={stage:'antre',log:[]};return B.clients[id]};
// ---------- sinkronisasi tim (Supabase)
const CFG=window.HC_CONFIG||{};
const sb=(CFG.url&&!/^ISI_/.test(CFG.url))?window.supabase.createClient(CFG.url,CFG.anonKey):null;
let me=null,snap={},lastPull=null,lastSync=null,tmSave=null,pulling=false,deferred=false;
const TBL='app_data';
const isDef=v=>v&&v.stage==='antre'&&(!v.log||!v.log.length)&&Object.keys(v).length<=2;
function pill(t,bad){const e=document.getElementById('syncpill');if(!e)return;e.firstElementChild.textContent=t;e.className=bad?'bad':''}
function dirtyRows(){const rows=[];
 for(const id in S.clients){const o=S.clients[id],v=JSON.stringify(o);if(snap['client:'+id]===v)continue;if(snap['client:'+id]===undefined&&isDef(o))continue;rows.push({kind:'client',key:id,value:o,_s:v})}
 for(const k of ['newClients','th']){if(S[k]===undefined)continue;const v=JSON.stringify(S[k]);if(snap['meta:'+k]!==v)rows.push({kind:'meta',key:k,value:S[k],_s:v})}
 return rows}
async function flush(){
 if(DEMO||!me)return;const rows=dirtyRows();if(!rows.length){pill('Tersimpan');return}
 pill('Menyimpan…');
 const {error}=await sb.from(TBL).upsert(rows.map(({kind,key,value})=>({kind,key,value})),{onConflict:'kind,key'});
 if(error){console.error(error);pill('Gagal simpan, mencoba lagi…',1);clearTimeout(tmSave);tmSave=setTimeout(flush,8000);return}
 rows.forEach(r=>{snap[r.kind+':'+r.key]=r._s});lastSync=Date.now();pill(dirtyRows().length?'Menyimpan…':'Tersimpan')}
function save(){if(DEMO||!me)return;S.saved=new Date().toISOString();clearTimeout(tmSave);pill('Menyimpan…');tmSave=setTimeout(flush,500)}
async function pull(first){
 if(pulling||!me)return false;pulling=true;let changed=false;
 try{
  let q=sb.from(TBL).select('kind,key,value,updated_at');
  if(!first&&lastPull)q=q.neq('kind','base').gte('updated_at',lastPull);
  const {data,error}=await q;if(error)throw error;
  if(first)setBase(data.filter(r=>r.kind==='base').sort((a,b)=>a.key-b.key).map(r=>r.value));
  for(const r of data){
   if(r.kind==='base')continue;
   if(!lastPull||r.updated_at>lastPull)lastPull=r.updated_at;
   const k=r.kind+':'+r.key,v=JSON.stringify(r.value);if(snap[k]===v)continue;
   const cur=r.kind==='client'?S.clients[r.key]:S[r.key];
   const dirty=cur!==undefined&&JSON.stringify(cur)!==snap[k]&&!(snap[k]===undefined&&r.kind==='client'&&isDef(cur));
   if(dirty)continue; // perubahan lokal belum terkirim, menang
   if(r.kind==='client')S.clients[r.key]=r.value;else S[r.key]=r.value;
   snap[k]=v;changed=true}
  lastSync=Date.now();pill('Tersimpan')
 }catch(e){console.error(e);pill('Offline / gagal sinkron',1)}
 finally{pulling=false}
 return changed}
function tick(){pull().then(ch=>{if(!ch&&!deferred)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){deferred=true;return}deferred=false;render()})}
function showLogin(msg){document.getElementById('login').style.display='flex';if(msg)document.getElementById('lerr').textContent=msg}
async function doLogin(ev){ev.preventDefault();if(!sb)return;const f=ev.target;
 const {error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value});
 if(error){document.getElementById('lerr').textContent='Email atau password salah.';return}location.reload()}
async function doLogout(){if(sb)await sb.auth.signOut();location.reload()}
async function boot(){
 if(!sb){showLogin('config.js belum diisi (lihat README).');return}
 const {data}=await sb.auth.getSession();
 if(!data.session){showLogin();return}
 me=data.session.user;document.getElementById('login').style.display='none';
 S.source='cloud';pill('Memuat…');await pull(true);render();
 setInterval(tick,15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
 window.addEventListener('online',flush);
 window.addEventListener('beforeunload',e=>{if(!DEMO&&me&&dirtyRows().length){e.preventDefault();e.returnValue=''}})}
let warnStore=false;
// dates
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=s=>{if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const TODAY=()=>DEMO?DEMO.today:iso(new Date());
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((P(a)-P(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fd=s=>{if(!s)return'–';const d=P(s);return d.getDate()+' '+MON[d.getMonth()]+' '+String(d.getFullYear()).slice(2)};
const rp=v=>v==null||isNaN(v)?'–':v===0?'Rp0':'Rp'+(v>=1e9?(v/1e9).toFixed(2).replace('.',',')+' M':v>=1e6?(v/1e6).toFixed(1).replace('.',',')+' jt':Math.round(v/1e3)+' rb');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let byId={};function refreshClients(){CLIENTS=BASE.concat(S.newClients||[]);byId=Object.fromEntries(CLIENTS.map(c=>[c.id,c]))}
const inTarget=c=>!c.isNew;
const sinceLast=c=>c.last?diff(TODAY(),c.last):null;
const eligible=c=>{const d=sinceLast(c);return d==null||d>=182};
function opener(c){const d=sinceLast(c);
 if(c.pool==='L')return d!=null&&d<182?'PRI-L-B':'PRI-L-A';
 if(c.pool==='A26')return d!=null&&d<182?'PRI-A6-':'PRI-A6+';
 if(c.pool==='D25')return c.last?'PRI-D25':'PRI-D24 (tanpa tanggal)';
 return c.last?'PRI-D24 + paragraf "sudah cukup lama"':'PRI-D24';}
const isBack=s=>BACK.has(s.stage)||(!!s.rutinDate&&!s.stage.startsWith('x_'));
function setStage(id,ns){const s=st(id);s.stage=ns;
 if(isBack(s)&&!s.backDate){s.backDate=TODAY();s.backType=ns}
 if(!isBack(s)){s.backDate=null;s.backType=null}
 if(ns.startsWith('x_'))s.exitDate=TODAY();}
function logA(id,t,n){const s=st(id);s.log=s.log||[];s.log.push({d:TODAY(),t,n:n||''});s.lastTouch=TODAY()}
// ---------- order
const SVC=['Cuci higienis','Cuci noda','Lainnya'];const SRC={cek:'Setelah cek gratis',rutin:'Jadwal rutin',langsung:'Langsung (tanpa cek)',referral:'Rumah referral'};
const ordersOf=s=>(s.orders||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
const paidOrders=s=>ordersOf(s).filter(o=>o.paid==='Y');
function syncOrder(id){const s=st(id);const os=ordersOf(s);if(!os.length)return;const last=os[os.length-1],pd=paidOrders(s);
 s.orderDate=last.d;s.orderItems=last.n;s.orderVal=last.val;
 if(pd.length){const lp=pd[pd.length-1];s.paidDate=lp.d;s.orderVal=lp.val;s.orderItems=lp.n;if(s.stage!=='rutin')setStage(id,'paid')}else{s.paidDate=null;if(SI[s.stage]<SI.order||s.stage.startsWith('x_'))setStage(id,'order')}}
function addOrder(id,o){const s=st(id);s.orders=(s.orders||[]).concat([o]);syncOrder(id);logA(id,'Order',(o.paid==='Y'?'Order lunas ':'Order dijadwalkan ')+rp(+o.val)+' · '+o.svc.join(' + ')+(o.inv?' · '+o.inv:''));save()}
function setOrderPaid(id,i,paid){const s=st(id);const o=ordersOf(s)[i];o.paid=paid;if(paid==='Y'&&!o.paidAt)o.paidAt=TODAY();syncOrder(id);logA(id,'Order',(paid==='Y'?'Lunas: ':'Belum lunas: ')+rp(+o.val));save();drawDr();render()}
const refsOf=id=>CLIENTS.filter(c=>c.refBy===id);
function giftDue(ref){const s=st(ref.id);const pd=paidOrders(s);return pd.length?pd[0].d:null}

// next action engine
function nextAction(c){const s=st(c.id),T=TODAY();
 if(s.keluh&&s.keluh.open)return{code:'KELUH',lab:'Keluhan terbuka: kabari langkahnya (maks. 2 hari)',due:add(s.keluh.d,1),scr:'KELUH',open:1};
 switch(s.stage){
 case'antre':if(!c.served)return{code:'AREA',lab:'Kota belum dilayani: putuskan dengan PH',due:null,scr:'',open:1};
  if(!c.greet)return{code:'PLAN',lab:c.isNew?'Klien Prioritas baru: hubungi dan tawarkan cek atau jadwal':'Belum ada di antrean: tentukan tanggal sapa',due:c.isNew?(c.added||T):null,scr:'',open:1};
  return{code:'OPEN',lab:'Kirim WhatsApp pembuka',due:c.greet,scr:opener(c)};
 case'disapa':{const f=s.fu||0,b=s.sent||T;
  const seq=[['F1','Telepon (belum dibalas)',2,'Telepon 5 langkah · tak diangkat: WA satu baris'],['F2','WhatsApp singkat',5,'H+5'],['F3','Telepon terakhir',9,'Telepon 5 langkah'],['F4','WhatsApp penutup',14,'H+14']];
  if(f<4){const q=seq[f];return{code:q[0],lab:q[1],due:add(b,q[2]),scr:q[3]}}
  return{code:'DIAM',lab:'Tidak ada balasan sampai H+14: tandai Diam (istirahat 5 bulan)',due:add(b,15),scr:''};}
 case'respon':return{code:'KUNCI',lab:'Kunci tanggal: cek gratis / perawatan / jadwal rutin',due:add(s.lastTouch||T,2),scr:eligible(c)?'T7b-VIP → SLOT → KUNCI':'Jadwal rutin (tanpa kata "gratis")'};
 case'cek':if(!s.cekDate)return{code:'CEKDT',lab:'Isi tanggal cek',due:T,scr:'',open:1};
  if(diff(s.cekDate,T)>=1&&!s.konf)return{code:'KONF',lab:'KONFIRMASI H-1 ke klien + BRIEF HC (sebelum 17.00)',due:add(s.cekDate,-1),scr:'KONFIRMASI H-1 · BRIEF HC'};
  if(diff(T,s.cekDate)>=0)return{code:'HASIL',lab:'Hari cek: buat Laporan Hasil Cek dari 2 foto per barang dari HC',due:s.cekDate,scr:'TIBA · laporan sore HC · Laporan Hasil Cek',open:1};
  return{code:'WAIT',lab:'Menunggu hari cek',due:s.cekDate,scr:'',quiet:1};
 case'cekdone':if(!s.laporDate)return{code:'LAPOR',lab:'Kirim Laporan Hasil Cek (gambar + pesan pengantar), lalu tandai terkirim',due:add(s.cekDate||T,1),scr:'Laporan Hasil Cek',open:1};
  const need=s.cekNeed!=null?s.cekNeed:(s.cekRes==='P'||s.cekRes==='D');
  if(need&&!s.l3)return{code:'L3',lab:'H+3: satu kalimat melanjutkan hasil',due:add(s.laporDate,2),scr:'H+3'};
  if(need&&!s.l7)return{code:'L7',lab:'H+7: penutup lembut',due:add(s.laporDate,6),scr:'H+7'};
  if(!s.rutinDate)return{code:'RUTINQ',lab:'Tanyakan bulan perawatan rutin, catat tanggalnya',due:add(s.laporDate,need?7:0),scr:'"Semua baik" / jadwal rutin',open:1};
  return{code:'OK',lab:'Jadwal rutin tercatat; ingatkan sebulan sebelumnya',due:add(s.rutinDate,-30),scr:'',quiet:1};
 case'order':if(!s.orderDate)return{code:'ORDT',lab:'Isi tanggal perawatan',due:T,scr:'',open:1};
  if(diff(s.orderDate,T)>=1&&!s.okonf)return{code:'OKONF',lab:'Konfirmasi H-1 perawatan',due:add(s.orderDate,-1),scr:'KONFIRMASI H-1'};
  if(diff(T,s.orderDate)>=0)return{code:'PAID',lab:'Perawatan sudah lewat: isi nilai order dan tandai selesai',due:s.orderDate,scr:'',open:1};
  return{code:'WAIT',lab:'Menunggu hari perawatan',due:s.orderDate,scr:'',quiet:1};
 case'paid':if(!s.mutu)return{code:'MUTU',lab:'MUTU H+7: tanya hasil + bulan rutin',due:add(s.paidDate||T,7),scr:'MUTU · H+7'};
  if(!s.rutinDate)return{code:'RUTINQ',lab:'Catat tanggal perawatan rutin berikutnya',due:add(s.mutu,3),scr:'',open:1};
  return{code:'TORUTIN',lab:'Pindahkan ke "Jadwal rutin terkunci"',due:T,scr:''};
 case'rutin':if(!s.rutinDate)return{code:'RUTINQ',lab:'Isi tanggal rutin',due:T,scr:'',open:1};
  if(!s.remind)return{code:'REMIND',lab:'Ingatkan jadwal rutin (sebulan sebelumnya)',due:add(s.rutinDate,-30),scr:'Pengingat rutin'};
  return{code:'WAIT',lab:'Rutin '+fd(s.rutinDate),due:s.rutinDate,scr:'',quiet:1};
 case'x_diam':return{code:'REOPEN',lab:'Masa istirahat selesai: boleh disapa lagi',due:add(s.exitDate||T,150),scr:'',quiet:diff(add(s.exitDate||T,150),T)>0,open:1};
 default:return null;}}
function dueCls(d){if(!d)return'soon';const x=diff(d,TODAY());return x<0?'over':x===0?'today':'soon'}
function dueTxt(d){if(!d)return'tanpa tanggal';const x=diff(d,TODAY());return x<0?'telat '+(-x)+' hari':x===0?'hari ini':x===1?'besok':fd(d)}
function doneAction(id,code){const s=st(id),T=TODAY();
 const m={OPEN:()=>{s.sent=T;s.fu=0;setStage(id,'disapa');logA(id,'WA','Pembuka '+opener(byId[id]))},
  F1:()=>{s.fu=1;logA(id,'Telepon','H+2')},F2:()=>{s.fu=2;logA(id,'WA','H+5')},F3:()=>{s.fu=3;logA(id,'Telepon','H+9')},F4:()=>{s.fu=4;logA(id,'WA','H+14 penutup')},
  DIAM:()=>{setStage(id,'x_diam');logA(id,'Catatan','Diam sampai H+14')},
  KUNCI:()=>{logA(id,'WA','Tindak lanjut jadwal')},
  KONF:()=>{s.konf=1;logA(id,'WA','KONFIRMASI H-1 + brief HC')},
  LAPOR:()=>{s.laporDate=T;logA(id,'WA','Laporan Hasil Cek')},L3:()=>{s.l3=1;logA(id,'WA','H+3')},L7:()=>{s.l7=1;logA(id,'WA','H+7')},
  OKONF:()=>{s.okonf=1;logA(id,'WA','Konfirmasi H-1 perawatan')},MUTU:()=>{s.mutu=T;logA(id,'WA','MUTU H+7')},
  TORUTIN:()=>{setStage(id,'rutin');logA(id,'Catatan','Rutin terkunci')},REMIND:()=>{s.remind=1;logA(id,'WA','Pengingat rutin')}};
 if(m[code]){m[code]();save();render()}else if(code==='LAPOR'||code==='HASIL')openReport(id);else openDr(id)}

// ---------- views
function nav(){const t=[['today','Hari ini'],['checks','Laporan Hasil Cek'],['orders','Order & Referral'],['clients','Semua klien'],['review','Review (Owner & GM)'],['growth','Faktor pertumbuhan'],['guide','Panduan']];
 document.getElementById('nav').innerHTML=t.map(x=>`<button class="${TAB===x[0]?'on':''}" onclick="TAB='${x[0]}';render()">${x[1]}</button>`).join('')}
const chip=p=>`<span class="chip ${p}">${POOLN[p]}</span>`;
const stg=s=>{const x=STAGES[SI[s]];return`<span class="st" style="background:${x[2]};color:${x[3]}">${x[1]}</span>`};
function actions(){return CLIENTS.map(c=>({c,a:nextAction(c),s:st(c.id)})).filter(x=>x.a)}
function vToday(){const T=TODAY();const all=actions().filter(x=>!x.a.quiet);
 const now=all.filter(x=>x.a.due&&diff(x.a.due,T)<=0).sort((a,b)=>(a.a.code==='KELUH'?-1:0)-(b.a.code==='KELUH'?-1:0)||diff(a.a.due,b.a.due)||b.c.v-a.c.v);
 const wk=all.filter(x=>x.a.due&&diff(x.a.due,T)>0&&diff(x.a.due,T)<=7).sort((a,b)=>diff(a.a.due,b.a.due));
 const nod=all.filter(x=>!x.a.due);
 const row=x=>`<div class="act"><div><div class="t">${esc(x.c.nick)} ${chip(x.c.pool)} <span class="due ${dueCls(x.a.due)}">${dueTxt(x.a.due)}</span></div>
  <div class="s">${esc(x.a.lab)}${x.a.scr?` · naskah <span class="code">${esc(x.a.scr)}</span>`:''} · ${esc(x.c.city)} · ${rp(x.c.v)} seumur hidup</div></div>
  <div class="b"><a class="btn" href="https://wa.me/${x.c.wa}" target="_blank" rel="noopener">WA</a><button onclick="openDr(${x.c.id})">Buka</button>${x.a.open?'':`<button class="pri" onclick="doneAction(${x.c.id},'${x.a.code}')">Selesai</button>`}</div></div>`;
 const open=CLIENTS.filter(c=>c.greet&&c.greet>T&&st(c.id).stage==='antre').sort((a,b)=>a.greet<b.greet?-1:1)[0];
 return `${banner()}<div class="grid g4">${tile('Harus dikerjakan hari ini',now.length,'termasuk yang telat')}${tile('Telat',now.filter(x=>diff(x.a.due,T)<0).length,'jatuh tempo sebelum hari ini')}${tile('7 hari ke depan',wk.length,'')}${tile('Kembali',CLIENTS.filter(c=>inTarget(c)&&isBack(st(c.id))).length,'dari target 91')}</div>
 <div class="sec">Hari ini dan yang telat</div>${now.length?now.map(row).join(''):`<div class="empty">Tidak ada tugas jatuh tempo hari ini.${open?` Sapaan pertama berikutnya: <b>${fd(open.greet)}</b> (${esc(open.nick)}).`:''}</div>`}
 <div class="sec">7 hari ke depan</div>${wk.length?wk.map(row).join(''):'<div class="empty">Kosong.</div>'}
 ${nod.length?`<div class="sec">Perlu keputusan (tanpa tanggal)</div>${nod.map(row).join('')}`:''}
 ${bdays()}${refDue()}`}
function refDue(){const T=TODAY();const L=[];CLIENTS.forEach(ref=>{if(!ref.refBy)return;const by=byId[ref.refBy];if(!by)return;const d=giftDue(ref);if(!d)return;const g=(st(by.id).refGifts||{})[ref.id];if(g&&g.sent)return;L.push({by,ref,d:add(d,3)})});L.sort((a,b)=>a.d<b.d?-1:1);
 return `<div class="sec">Terima kasih referral · hadiah kecil (${L.length})</div>`+(L.length?L.map(r=>`<div class="act"><div><div class="t">${esc(r.by.nick)} <span class="cid">${r.by.cid}</span> <span class="due ${dueCls(r.d)}">${dueTxt(r.d)}</span></div><div class="s">Rumah referral ${esc(r.ref.nick)} (${r.ref.cid}) sudah selesai dirawat dan lunas. Kirim ucapan terima kasih pribadi + hadiah kecil. Tanpa menyebut "program" atau imbalan berikutnya.</div></div><div class="b"><a class="btn" href="https://wa.me/${r.by.wa}" target="_blank" rel="noopener">WA</a><button onclick="openDr(${r.by.id})">Buka</button><button class="pri" onclick="giftSent(${r.by.id},${r.ref.id})">Terkirim</button></div></div>`).join(''):'<div class="empty">Belum ada. Muncul otomatis 3 hari setelah rumah referral lunas.</div>')}
function giftSent(byId_,refId){const s=st(byId_);s.refGifts=s.refGifts||{};s.refGifts[refId]={sent:TODAY()};logA(byId_,'WA','Terima kasih + hadiah referral untuk '+byId[refId].nick);save();render();if(CUR)drawDr()}

function newItem(){return{on:true,name:'',room:'',q:'kiri atas',obs:{},rusak:false,cat:'',photos:{barang:'',vakum:''},pt:{},pw:null,mode:'air',m:{}};}

// ---- pengukuran warna (CIELAB D65)
function lin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
function lab(r,g,b){const R_=lin(r),G=lin(g),B=lin(b);const X=(R_*.4124+G*.3576+B*.1805)/.95047,Y=R_*.2126+G*.7152+B*.0722,Z=(R_*.0193+G*.1192+B*.9505)/1.08883;
 const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;const fx=f(X),fy=f(Y),fz=f(Z);return[116*fy-16,500*(fx-fy),200*(fy-fz)]}
const IMG={};
function loadImg(src){return new Promise(res=>{if(IMG[src])return res(IMG[src]);const im=new Image();im.onload=()=>{IMG[src]=im;res(im)};im.onerror=()=>res(null);im.src=src})}
const BOX=0.22;
async function measure(src,pt){const im=await loadImg(src);if(!im)return null;const W=im.naturalWidth,H=im.naturalHeight,s=Math.min(W,H)*BOX;
 const cx=pt[0]*W,cy=pt[1]*H;const x0=Math.max(0,Math.round(cx-s/2)),y0=Math.max(0,Math.round(cy-s/2)),w=Math.max(4,Math.min(Math.round(s),W-x0)),h=Math.max(4,Math.min(Math.round(s),H-y0));
 const cv=document.createElement('canvas');const k=Math.min(1,60/Math.max(w,h));cv.width=Math.max(4,Math.round(w*k));cv.height=Math.max(4,Math.round(h*k));
 const g=cv.getContext('2d');g.drawImage(im,x0,y0,w,h,0,0,cv.width,cv.height);const d=g.getImageData(0,0,cv.width,cv.height).data;
 const px=[];for(let i=0;i<d.length;i+=4)px.push(lab(d[i],d[i+1],d[i+2]));px.sort((p,q)=>p[0]-q[0]);const mid=px.slice(Math.floor(px.length*.1),Math.ceil(px.length*.9));
 const avg=j=>mid.reduce((s,p)=>s+p[j],0)/mid.length;return{L:avg(0),a:avg(1),b:avg(2)}}
// putih otomatis = kertas di bingkai luar foto hasil vakum (12% tiap sisi, separuh piksel paling terang)
async function measureWhite(src){const im=await loadImg(src);if(!im)return null;const k=Math.min(1,220/Math.max(im.naturalWidth,im.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);
 const g=cv.getContext('2d');g.drawImage(im,0,0,cv.width,cv.height);const d=g.getImageData(0,0,cv.width,cv.height).data;const W=cv.width,H=cv.height,bx=Math.round(W*.12),by=Math.round(H*.12);const px=[];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(x>=bx&&x<W-bx&&y>=by&&y<H-by)continue;const q=(y*W+x)*4;px.push(lab(d[q],d[q+1],d[q+2]))}
 px.sort((p,q)=>q[0]-p[0]);const top=px.slice(0,Math.max(1,Math.floor(px.length/2)));const avg=j=>top.reduce((s,p)=>s+p[j],0)/top.length;return{L:avg(0),a:avg(1),b:avg(2)}}
function score(it){const w=it.m.white,d=it.m.air;if(!it.photos.vakum)return{lv:0,why:'Skor belum bisa dihitung: foto hasil vakum (foto 2) belum diunggah.'};if(!w||!d)return{lv:0,why:'Sedang mengukur foto...'};
 if(w.L<70)return{lv:0,why:'Kertas putih di sekeliling wadah tidak terlihat jelas atau cahaya kurang. Minta HC foto ulang hasil vakumnya.',bad:1};
 const idx=Math.max(0,w.L-d.L)+0.5*Math.max(0,d.b-w.b);let lv=1;TH().forEach(t=>{if(idx>=t)lv++});return{lv,idx}}

// ---- aturan tetap: skor + temuan -> kesimpulan + saran
function plan(it){const s=score(it),o=it.obs,nm=it.name||'barang ini';
 if(o.jamur)return{con:'G',sar:[{t:'Ganti '+nm,d:'Ditemukan jamur. HydroClean tidak membersihkan jamur; saran terbaik untuk keluarga adalah mengganti barang ini.'}],treat:false};
 if(it.rusak)return{con:'G',sar:[{t:'Perbaiki atau ganti '+nm,d:'Ada kerusakan pada bahan, sehingga perawatan tidak lagi tepat untuk barang ini.'}],treat:false};
 let r=-1;const sar=[];
 if(s.lv)r=Math.max(r,s.lv>=4?2:s.lv===3?1:0);
 const hig=[];if(s.lv>=4)hig.push('banyak kotoran terangkat dari bagian yang dicek');else if(s.lv===3)hig.push('kotoran mulai menumpuk di dalam lapisan bahan');
 if(o.lembap){hig.push('ada bagian yang lembap');r=Math.max(r,2)}
 if(o.bau){hig.push('ada bau saat ditekan');r=Math.max(r,1)}
 if(hig.length)sar.push({t:'Cuci higienis',d:'Karena '+hig.join(', ')+'.'});
 if(o.noda){sar.push({t:'Cuci noda',d:'Untuk noda yang terlihat. Noda bisa berkurang, tergantung jenis nodanya.'});r=Math.max(r,1)}
 if(o.jahitan)r=Math.max(r,1);
 if(r<0)return{con:null,sar:[],treat:false};
 const treat=sar.length>0;
 if(!treat)sar.push({t:'Belum perlu perawatan',d:o.jahitan?'Jahitan atau kain yang perlu diperhatikan sudah kami catat. Selebihnya cukup dilihat lagi saat jadwal rutin.':'Cukup dilihat lagi saat jadwal rutin.'});
 return{con:['B','P','D'][r],sar,treat}}
function notes(it){const o=it.obs,a=[];if(o.jamur)a.push('ditemukan jamur');if(o.noda)a.push('ada noda');if(o.lembap)a.push('ada bagian yang lembap');if(o.bau)a.push('ada bau saat ditekan');if(o.jahitan)a.push('jahitan atau kain perlu diperhatikan');if(it.rusak)a.push('kerusakan pada bahan');return a.length?a.join(', '):'tidak ada temuan khusus'}
const sarShort=p=>!p.con?'[belum dinilai]':p.con==='G'?p.sar[0].t.toLowerCase():p.treat?p.sar.filter(x=>x.t.startsWith('Cuci')).map(x=>x.t.toLowerCase()).join(' + '):'belum perlu perawatan';
const sarText=p=>!p.con?'[belum dinilai]':p.con==='G'?'disarankan diganti':p.treat?'disarankan '+p.sar.filter(x=>x.t.startsWith('Cuci')).map(x=>x.t.toLowerCase()).join(' + '):'belum perlu perawatan';

// ---- foto
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.88))};im.src=r.result};r.readAsDataURL(file)})}
async function remeasure(i){const it=R.items[i];if(!it.photos.vakum){it.m={};return}
 it.m.air=await measure(it.photos.vakum,it.pt.air||[.5,.5]);it.m.white=it.pw?await measure(it.photos.vakum,it.pw):await measureWhite(it.photos.vakum);}
async function drawThumb(cv,it){const im=await loadImg(it.photos.vakum);if(!im)return;const W=cv.clientWidth||200;const k=W/im.naturalWidth;cv.width=W*2;cv.height=Math.round(im.naturalHeight*k)*2;const g=cv.getContext('2d');g.drawImage(im,0,0,cv.width,cv.height);
 const s=Math.min(cv.width,cv.height)*BOX;const box=(pt,col,t)=>{const cx=pt[0]*cv.width,cy=pt[1]*cv.height;g.lineWidth=4;g.strokeStyle=col;g.strokeRect(cx-s/2,cy-s/2,s,s);g.strokeStyle='#fff';g.lineWidth=1.5;g.strokeRect(cx-s/2-3,cy-s/2-3,s+6,s+6);g.fillStyle=col;g.font='bold 20px sans-serif';g.fillText(t,cx-s/2,cy-s/2-8)};
 box(it.pt.air||[.5,.5],'#00A7C4','air');if(it.pw)box(it.pw,'#C98A00','putih');}
async function drawSmall(cv,src){const im=await loadImg(src);if(!im)return;const W=cv.clientWidth||200;cv.width=W*2;cv.height=Math.round(im.naturalHeight*W/im.naturalWidth)*2;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height)}

 <div class="score"><div class="big">${s.lv||'–'}</div><div>${s.lv?`<b>Skor hasil vakum: ${s.lv} · ${LV[s.lv-1].t}</b><br><span class="small muted">indeks ${s.idx.toFixed(1)} · ambang ${TH().join(' · ')}</span>`:esc(s.why)}</div></div>

 else if(ok.length)w+=`\nKondisinya masih baik. Bulan apa yang enak untuk dilihat lagi? Nanti saya ingatkan.`;
 if(gan.length)w+=`\n\nUntuk ${J(gan.map(nm))}, saran kami diganti; penjelasannya ada di laporan.`;
 w+=`\n\nElfi`;const ta=document.getElementById('rpwa');if(ta&&!R.waEdited)ta.value=w;}

function repProblems(){const its=actItems();const pr=[];its.forEach((it,i)=>{const p=plan(it),s=score(it);if(!it.name)pr.push('Barang '+(i+1)+': nama barang belum diisi.');if(!it.photos.barang)pr.push((it.name||'Barang '+(i+1))+': foto barang belum ada.');if(s.bad)pr.push((it.name||'Barang '+(i+1))+': foto hasil vakum perlu diulang.');else if(!p.con)pr.push((it.name||'Barang '+(i+1))+': skor belum bisa dihitung.')});return pr}
function saveCheck(silent){const pr=repProblems();if(pr.length&&!confirm('Masih ada yang belum lengkap:\n- '+pr.join('\n- ')+'\n\nTetap simpan ke profil?'))return false;
 const s=st(R.id),its=actItems(),ps=its.map(plan);
 const rec={d:R.date||TODAY(),hc:R.hc,elfi:R.elfi==='1',pen:R.pen,items:its.map((it,i)=>{const sc=score(it);return{name:it.name,room:it.room,obs:{...it.obs},rusak:it.rusak,lv:sc.lv||null,idx:sc.idx?+sc.idx.toFixed(1):null,con:ps[i].con,sar:ps[i].sar.map(x=>x.t),cat:it.cat}}),lain:R.lain};
 s.checks=(s.checks||[]).filter(x=>x.d!==rec.d).concat([rec]).sort((a,b)=>a.d<b.d?-1:1);
 const worst=ps.reduce((m,p)=>p.con&&(!m||CON[p.con].r>CON[m].r)?p.con:m,null);
 s.cekDate=rec.d;s.cekDone=rec.d;s.cekRes=worst;s.cekNeed=ps.some(p=>p.treat);s.cekItems=its.map(it=>it.name).filter(Boolean).join(', ');s.cekHadir=R.elfi==='1'?'Y':'T';s.cekHC=R.hc;
 if(R.sap)s.sapaan=R.sap;if(R.area)s.area=R.area;
 if(R.lain){const cur=(s.other||'').split(',').map(x=>x.trim()).filter(Boolean);R.lain.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!cur.includes(x))cur.push(x)});s.other=cur.join(', ')}
 if(s.stage.startsWith('x_')||SI[s.stage]<SI.cekdone)setStage(R.id,'cekdone');
 if(!R.saved)logA(R.id,'Kunjungan','Cek selesai: '+its.map((it,i)=>(it.name||'barang')+' '+(ps[i].con?CON[ps[i].con].t.toLowerCase():'?')).join(', '));
 R.saved=true;save();if(!silent)alert('Tersimpan di profil '+byId[R.id].cid+'.');return true}
function markSent(){if(!R.saved&&!saveCheck(true))return;const s=st(R.id);s.laporDate=TODAY();logA(R.id,'WA','Laporan Hasil Cek terkirim');save();alert('Laporan dicatat terkirim hari ini. Langkah berikutnya muncul di tab Hari ini.')}
function savePNG(){const pr=repProblems();if(pr.length&&!confirm('Masih ada yang belum lengkap:\n- '+pr.join('\n- ')+'\n\nTetap simpan gambar?'))return;if(!R.saved)saveCheck(true);
 if(!window.html2canvas){alert('Alat gambar tidak termuat.');return}html2canvas(document.getElementById('rep'),{scale:2,backgroundColor:'#ffffff'}).then(cv=>{const a=document.createElement('a');a.download='Laporan-Hasil-Cek-'+byId[R.id].cid+'-'+(R.date||TODAY())+'.png';a.href=cv.toDataURL('image/png');a.click()})}

// contoh (foto buatan, bukan foto asli)
function fakeItem(col,stain,n){const cv=document.createElement('canvas');cv.width=520;cv.height=400;const g=cv.getContext('2d');g.fillStyle='#E8E4DC';g.fillRect(0,0,520,400);g.fillStyle=col;g.fillRect(40,90,440,250);
 for(let i=40;i<480;i+=22){g.fillStyle='rgba(0,0,0,.05)';g.fillRect(i,90,2,250)}if(stain){g.fillStyle='rgba(120,90,50,.45)';g.beginPath();g.ellipse(170,200,46,30,.4,0,7);g.fill()}g.fillStyle='rgba(60,60,60,.5)';g.font='13px sans-serif';g.fillText('contoh '+n,12,388);return cv.toDataURL('image/jpeg',.9)}
function fakeVac(water,n){const cv=document.createElement('canvas');cv.width=420;cv.height=420;const g=cv.getContext('2d');g.fillStyle='#F5F5F2';g.fillRect(0,0,420,420);g.fillStyle='rgba(0,0,0,.06)';g.fillRect(150,90,120,250);g.fillStyle=water;g.fillRect(160,140,100,190);g.fillStyle='rgba(255,255,255,.5)';g.fillRect(170,148,10,170);g.strokeStyle='#C9CFD1';g.lineWidth=3;g.strokeRect(158,90,104,242);
 g.fillStyle='rgba(60,60,60,.5)';g.font='13px sans-serif';g.fillText('contoh '+n,12,408);return cv.toDataURL('image/jpeg',.9)}
async function loadRepExample(){Object.assign(R,{hc:R.hc||'Andi',sap:R.sap||'Bu '+byId[R.id].nick,lain:'sofa ruang tamu',bulan:'April 2027'});
 const a=newItem(),b=newItem();Object.assign(a,{name:'Kasur king',room:'kamar utama',obs:{noda:true,lembap:true}});Object.assign(b,{name:'Sofa 3 dudukan',room:'ruang keluarga',cat:'Kain terawat.'});
 a.photos={barang:fakeItem('#CFC6B4',true,'kasur'),vakum:fakeVac('#8C6A43','hasil vakum')};b.photos={barang:fakeItem('#8E99A3',false,'sofa'),vakum:fakeVac('#E4E7E2','hasil vakum')};
 R.items=[a,b];R.saved=false;R.waEdited=0;await remeasure(0);await remeasure(1);drawRP()}

boot();
